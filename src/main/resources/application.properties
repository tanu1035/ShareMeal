spring.application.name=sharemeal

# Console application: no web server
spring.main.web-application-type=none
spring.main.banner-mode=off

# MySQL (override with environment variables DB_USER / DB_PASSWORD)
spring.datasource.url=jdbc:mysql://localhost:3306/sharemeal?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}

# Hibernate creates/updates tables automatically (sql/schema.sql is the same design for submission)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Keep the console clean; warnings and errors go to a file
logging.level.root=WARN
logging.level.com.sharemeal=WARN
logging.file.name=logs/sharemeal.log

# Default admin created on first run
sharemeal.admin.email=admin@sharemeal.com
sharemeal.admin.password=Admin@123
